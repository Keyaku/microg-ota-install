name: Release

# Push a `vX.Y.Z` tag to build and publish a GitHub Release with the flashable
# zips. `workflow_dispatch` runs a test build (no release) whose zips are kept
# as workflow artifacts.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # needed for `gh release create`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so `git describe` resolves pkgver

      # The AOSP permission DB (fetched per-API from android.googlesource.com) is
      # expensive and flaky to rebuild; cache it across runs. Only the DB is
      # cached, not the upstream tools, so upstream fixes are still picked up each
      # build. Bump the key suffix to force a rebuild.
      - name: Cache AOSP permission DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/microg-ota-install/perm-db
          key: microg-permdb-v1

      # curl, jq, zip, unzip are all preinstalled on ubuntu-latest.
      - name: Build packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lifts GitHub API rate limits
        run: ./build-microg-ota.sh

      - name: Read versions
        id: ver
        run: |
          . package/version.env
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"
          echo "mgver=$mgver"   >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: microg-ota-${{ steps.ver.outputs.pkgver }}
          path: releases/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release if it does not exist yet (e.g. a plain tag push);
          # if it was already created (e.g. via the web UI), leave its notes
          # alone and just (re)attach the assets. Idempotent either way.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME — microG v${{ steps.ver.outputs.mgver }}" \
              --notes "microG OTA package \`${{ steps.ver.outputs.pkgver }}\` — bundles microG GmsCore \`${{ steps.ver.outputs.mgver }}\`."
          gh release upload "$GITHUB_REF_NAME" --clobber \
            releases/microg-ota-product-*.zip \
            releases/microg-uninstall.zip
